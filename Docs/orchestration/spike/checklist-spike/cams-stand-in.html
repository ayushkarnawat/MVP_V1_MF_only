<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMS stand-in</title>
  <link rel="stylesheet" href="spike.css">
</head>
<body>
  <main>
    <h1>CAMS stand-in</h1>
    <p>This is a fake form. Leave the boxes empty. Nothing is submitted, read or logged.</p>
    <form autocomplete="off" onsubmit="return false">
      <p><label for="email">Email</label><br><input id="email" type="email" placeholder="invented@example.invalid" autocomplete="off"></p>
      <p><label for="password">Password</label><br><input id="password" type="password" placeholder="Made-up password only" autocomplete="off"></p>
    </form>
    <p>Keep this tab in front. Check whether the floating checklist stays above it, then tick an item there. Return to the main tab to inspect its state and record your observation.</p>
  </main>
</body>
</html>
