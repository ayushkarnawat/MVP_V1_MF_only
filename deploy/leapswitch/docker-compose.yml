# LeapSwitch/CloudPe staging stack (Docs/orchestration/leapswitch-staging-plan.html).
# Single a.gp1.16g VM. No managed container orchestrator, database or load
# balancer exist here -- this is the plain-VM equivalent of ECS + RDS + ALB,
# built additively, never touching AWS staging/production (see that plan's
# "Protecting the AWS setup" section).
#
# `worker` is D2's option 1 (go received 2026-10-15): a long-lived sibling
# container on this compose network running app/worker_server.py. Its
# mem_limit/cpus are a SINGLE cgroup ceiling for the whole container, shared
# across every concurrent subprocess worker_server.py spawns (unlike AWS ECS,
# where each RunTask is its own container with its own independent cap, so
# one oversized job there only kills itself). Sized at 3 GB / 1.0 CPU to
# match MAX_CONCURRENT_RECOMPUTES=3 in worker_server.py -- the memory this
# frees versus a 5-slot pool is spent on a 3rd uvicorn worker on `backend`
# instead (dashboard concurrency over recompute-pool depth, decided
# 16 Oct 2026; see the plan's "Is a.gp1.16g right?" section). The backend
# talks to the worker over this network, never via the Docker socket.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # postgres:16-alpine's defaults (shared_buffers ~128MB) assume a shared
    # host, not a container with 3 GB budgeted to it -- these flags are the
    # same "use the RAM we already pay for" idea as the worker CPU bump
    # above, applied to the one service most likely to actually benefit
    # (query speed, not job throughput).
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      ANALYTICS_DISPATCH_MODE: worker_container
      WORKER_CONTAINER_URL: http://worker:8008
    # Dockerfile doesn't COPY these (AWS runs alembic from a local venv over
    # the SSM tunnel instead, never inside the ECS task) -- bind-mounted here
    # so `docker compose run --rm backend alembic upgrade head` (README step
    # 5) has something to run against.
    volumes:
      - ../../backend/alembic.ini:/app/alembic.ini:ro
      - ../../backend/alembic:/app/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
    # 3 uvicorn workers (vs. AWS's 1-per-task), since the VM has vCPUs to
    # spare and this is the lever that actually matters for "several
    # testers load the dashboard at once" -- unlike the recompute worker
    # pool (worker service below), each uvicorn worker is an independent
    # process able to serve a request without waiting on another's. Raised
    # from 2 on 16 Oct 2026, funded by shrinking the recompute pool from 5
    # to 3 (worker service below) rather than spending more of the 16 GB
    # budget outright.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3"]
    expose:
      - "8000"

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.worker_server:app", "--host", "0.0.0.0", "--port", "8008"]
    # 3 GB/1.0 CPU is a ceiling shared across ALL 3 concurrent recompute
    # subprocesses (see the module docstring above), not a per-job cap --
    # sized for 3 slots at up to ~1 GB each per the plan's memory budget. A
    # sustained combined overrun gets the whole container OOM-killed,
    # taking every in-flight recompute with it, not just the oversized one
    # -- this is the one real isolation gap vs. the AWS ECS task it
    # replaces, where each RunTask only ever kills itself. Watched by
    # scripts/check-memory.sh during the daily-batch window this is
    # tightest against (crontab.leapswitch).
    cpus: "1.0"
    mem_limit: "3g"
    expose:
      - "8008"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
