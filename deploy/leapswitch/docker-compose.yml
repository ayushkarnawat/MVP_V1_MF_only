# LeapSwitch/CloudPe staging stack (Docs/orchestration/leapswitch-staging-plan.html).
# Single a.gp1.16g VM. No managed container orchestrator, database or load
# balancer exist here -- this is the plain-VM equivalent of ECS + RDS + ALB,
# built additively, never touching AWS staging/production (see that plan's
# "Protecting the AWS setup" section).
#
# `worker` is D2's option 1 (go received 2026-10-15): a long-lived sibling
# container on this compose network running app/worker_server.py, capped at
# 1 GB (unchanged from the AWS ECS task it replaces -- that's not the
# bottleneck, see the plan's D2/"spare capacity" discussion) and 1.0 CPU
# (raised from 0.5 16 Oct 2026 -- cheap given 4 idle vCPUs most of the day,
# removes a throttle that served no resource-sharing purpose). The backend
# talks to it over this network, never via the Docker socket.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # postgres:16-alpine's defaults (shared_buffers ~128MB) assume a shared
    # host, not a container with 3 GB budgeted to it -- these flags are the
    # same "use the RAM we already pay for" idea as the worker CPU bump
    # above, applied to the one service most likely to actually benefit
    # (query speed, not job throughput).
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      ANALYTICS_DISPATCH_MODE: worker_container
      WORKER_CONTAINER_URL: http://worker:8008
    depends_on:
      postgres:
        condition: service_healthy
    # 2 uvicorn workers (vs. AWS's 1-per-task), since the VM has vCPUs to
    # spare for this and a 2nd worker means one slow dashboard request
    # doesn't block other testers' requests behind it.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose:
      - "8000"

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.worker_server:app", "--host", "0.0.0.0", "--port", "8008"]
    # Same cap as the AWS ECS task it replaces (D2) -- a 4th concurrent
    # recompute queues behind these 3, matching the 3-container AWS "bump"
    # shape this plan sizes against (see leapswitch-staging-plan.html).
    cpus: "0.5"
    mem_limit: "1g"
    expose:
      - "8008"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
