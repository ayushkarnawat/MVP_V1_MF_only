name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
        working-directory: .
      - run: python -m pytest -m "not postgres" -v
        working-directory: backend

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unifolio
          POSTGRES_PASSWORD: unifolio
          POSTGRES_DB: unifolio_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U unifolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -m postgres -v
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://unifolio:unifolio@localhost:5433/unifolio_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
