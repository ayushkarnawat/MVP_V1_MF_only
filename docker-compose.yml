services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unifolio
      POSTGRES_PASSWORD: unifolio
      POSTGRES_DB: unifolio_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifolio"]
      interval: 5s
      timeout: 5s
      retries: 5
